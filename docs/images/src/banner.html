<!doctype html>
<!-- Баннер для README. Пересобрать: cd webapp && node scripts/readme-images.mjs -->
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Unbounded:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body { background: #060608; }
      #canvas {
        position: relative;
        width: 1280px;
        height: 420px;
        overflow: hidden;
        background:
          radial-gradient(60% 90% at 78% 55%, rgb(232 48 248 / 7%), transparent 70%),
          #060608;
        color: #f4f4f6;
        font-family: Manrope, sans-serif;
      }
      /* диагональные штрихи, как на обложке */
      .streak {
        position: absolute;
        width: 2px;
        background: linear-gradient(to bottom, transparent, #e830f8 50%, transparent);
        box-shadow: 0 0 22px 2px rgb(232 48 248 / 45%);
        transform: rotate(38deg);
      }
      .s1 { height: 300px; top: -70px; left: 70px; }
      .s2 { height: 260px; bottom: -80px; right: 120px; }

      .left { position: absolute; left: 96px; top: 50%; transform: translateY(-50%); }
      .mark {
        font-family: Unbounded, sans-serif;
        font-weight: 800;
        font-size: 128px;
        line-height: 0.9;
        letter-spacing: -0.04em;
      }
      .mark span { color: #e830f8; text-shadow: 0 0 30px rgb(232 48 248 / 55%); }
      .name {
        margin-top: 18px;
        font-family: Unbounded, sans-serif;
        font-weight: 800;
        font-size: 52px;
        letter-spacing: -0.03em;
      }
      .tagline {
        margin-top: 18px;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #9c9ca2;
      }

      /* чек с зубчатым низом и пурпурной кромкой */
      .receipt {
        --zig: 10px;
        position: absolute;
        right: 120px;
        top: 52px;
        width: 380px;
        padding: 24px 26px 34px;
        background: linear-gradient(180deg, #1b1b20, #111114);
        border-radius: 18px 18px 0 0;
        transform: rotate(-4deg);
        -webkit-mask:
          conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / calc(var(--zig) * 2) var(--zig) repeat-x,
          linear-gradient(#000 0 0) top / 100% calc(100% - var(--zig) + 1px) no-repeat;
      }
      .receipt::before {
        content: "";
        position: absolute;
        left: 0; top: 20px; bottom: 0;
        width: 2px;
        background: linear-gradient(to bottom, transparent, #e830f8 55%);
        box-shadow: 0 0 14px rgb(232 48 248 / 50%);
      }
      .receipt::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(110% 60% at 0% 100%, rgb(232 48 248 / 18%), transparent 60%);
      }
      .receipt > * { position: relative; z-index: 1; }
      .head {
        display: flex; justify-content: space-between; align-items: baseline;
        font-family: Unbounded, sans-serif; font-weight: 700; font-size: 16px;
        padding-bottom: 12px; border-bottom: 1px dashed rgb(255 255 255 / 18%);
      }
      .head small { font-family: Manrope; font-weight: 700; font-size: 12px; color: #9c9ca2; }
      .line { display: flex; gap: 8px; align-items: baseline; padding: 6px 0; font-size: 14px; font-weight: 600; }
      .line i { flex: 1; border-bottom: 1px dotted #5d5d66; transform: translateY(-4px); }
      .line b { font-weight: 800; }
      .lines { padding: 10px 0 8px; }
      .settle {
        margin-top: 8px;
        padding: 12px 14px;
        border-radius: 12px;
        background: rgb(232 48 248 / 10%);
        box-shadow: inset 0 0 0 1px rgb(232 48 248 / 35%);
      }
      .settle .t { display: flex; justify-content: space-between; font-weight: 800; font-size: 14px; padding: 3px 0; }
      .settle .t b { font-family: Unbounded; color: #e830f8; }

      /* три человека и стрелки по кругу — мотив обложки, мелко за чеком */
      .cycle { position: absolute; right: 30px; bottom: 26px; width: 150px; opacity: 0.9; }
    </style>
  </head>
  <body>
    <div id="canvas">
      <div class="streak s1"></div>
      <div class="streak s2"></div>

      <div class="left">
        <div class="mark">S<span>/</span>B</div>
        <div class="name">SplitBill</div>
        <div class="tagline">Раздели платёж — сохрани дружбу</div>
      </div>

      <div class="receipt">
        <div class="head">Алматы, март <small>3 человека</small></div>
        <div class="lines">
          <div class="line">Квартира на 3 ночи<i></i><b>135 000 ₸</b></div>
          <div class="line">Ужин в «Дастархане»<i></i><b>48 600 ₸</b></div>
          <div class="line">Боулинг<i></i><b>12 000 ₸</b></div>
        </div>
        <div class="settle">
          <div class="t">Даша → Роман <b>63 000 ₸</b></div>
          <div class="t">Арман → Роман <b>54 300 ₸</b></div>
        </div>
      </div>

      <svg class="cycle" viewBox="0 0 168 150" aria-hidden="true">
        <defs>
          <radialGradient id="ball" cx="35%" cy="30%" r="75%">
            <stop offset="0" stop-color="#2c2c33" />
            <stop offset="0.7" stop-color="#141418" />
          </radialGradient>
          <marker id="tip" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
            <path d="M0 0 L10 5 L0 10 z" fill="#e830f8" />
          </marker>
        </defs>
        <g fill="none" stroke="#e830f8" stroke-width="4" stroke-linecap="round" marker-end="url(#tip)">
          <path d="M102 26 Q132 30 140 58" />
          <path d="M128 118 Q108 136 80 130" />
          <path d="M30 104 Q20 76 40 52" />
        </g>
        <g fill="#9c9ca2">
          <circle cx="70" cy="34" r="24" fill="url(#ball)" stroke="rgb(255 255 255 / 8%)" />
          <circle cx="70" cy="28" r="7" /><path d="M58 47 a12 10 0 0 1 24 0 z" />
          <circle cx="136" cy="92" r="24" fill="url(#ball)" stroke="rgb(255 255 255 / 8%)" />
          <circle cx="136" cy="86" r="7" /><path d="M124 105 a12 10 0 0 1 24 0 z" />
          <circle cx="42" cy="120" r="24" fill="url(#ball)" stroke="rgb(255 255 255 / 8%)" />
          <circle cx="42" cy="114" r="7" /><path d="M30 133 a12 10 0 0 1 24 0 z" />
        </g>
      </svg>
    </div>
  </body>
</html>
